{{ $related := .Site.RegularPages.Related . }}
{{ $related := where $related "Type" "ne" "log" }}
{{ with $related }}
<div class="related-posts py-10">
  <h3 class="font-bold text-ht-light text-[2em] mb-3">You might also enjoy</h3>
  <ul class="post-related-links ms-3.5">
    {{ range . }}
    <li class="related-post list-disc w-fit
              text-ht-lighter
                  text-xs      mt-2
                  md:text-base md:mt-1">
      <a class="decoration-ht-lightest" href="{{ .RelPermalink }}">
        {{ partial "get-title-for-post.html" . }}
      </a>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
