{{ $id := .Get "id" | default (.Get 0) }}
{{ $start := .Get "start" | default 0 }}

{{ $end := .Get "end" | default 0 }}

{{/* Size the frame from its own width; padding percentages resolve against the full-width parent. */}}
<div class="relative w-full aspect-video overflow-hidden">
    <iframe src="https://www.youtube-nocookie.com/embed/{{ $id }}?rel=0&start={{ $start }}&end={{ $end }}"
            class="absolute inset-0 w-full h-full border-0"
            allowfullscreen=""></iframe>
</div>
